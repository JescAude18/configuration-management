- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create root directory
  ansible.builtin.file:
    path: /var/www/roadmap/
    state: directory

- name: Copy nginx.conf template to server
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/nginx.conf
  notify: Reload nginx when config changes

- name: Enable nginx.conf by symlink
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nginx.conf
    dest: /etc/nginx/sites-enabled/nginx.conf
    state: link

- name: Disable default nginx configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Handle nginx service
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
